<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulário de Descrição com Entrada por Voz</title>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f5f3;
    --surface: #ffffff;
    --surface2: #f1efe8;
    --border: rgba(0,0,0,0.1);
    --border-focus: rgba(0,0,0,0.3);
    --text: #1a1a18;
    --text-dim: #aaa89f;
    --text-label: #5f5e5a;
    --accent: #1a1a18;
    --accent-dark: #2c2c2a;
    --active-mic: #e63946;
    --mono: 'Courier New', 'Consolas', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 3rem 1rem 4rem;
  }

  .wrap {
    width: 100%;
    max-width: 560px;
  }

  header {
    margin-bottom: 2.5rem;
  }

  .tag {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
    color: var(--text);
  }

  /* Aba/Tabs de Itens */
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: thin;
  }

  .tab-btn {
    padding: 8px 16px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }

  .tab-btn:hover {
    background: var(--border);
  }

  .tab-btn.active {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }

  .tab-btn.add-btn {
    background: transparent;
    border: 1px dashed var(--border-focus);
    color: var(--text);
  }

  .tab-btn.add-btn:hover {
    background: var(--surface2);
    border-color: var(--accent);
  }

  .section-label {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-label);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin: 24px 0 8px;
    display: block;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 1px;
  }

  .field {
    background: var(--surface);
    padding: 14px 16px 12px;
    position: relative;
    transition: background 0.15s;
  }

  .field:focus-within {
    background: var(--surface2);
    z-index: 1;
  }

  .field.full {
    grid-column: 1 / -1;
  }

  .field label {
    display: block;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #1a1a18;
    margin-bottom: 3px;
    transition: color 0.15s;
  }

  .field:focus-within label {
    color: var(--accent);
  }

  /* Wrapper flex para alinhar o input/textarea com o botão de microfone */
  .input-mic-wrapper {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .field input,
  .field textarea {
    flex: 1;
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    caret-color: var(--accent);
  }

  .field input::placeholder,
  .field textarea::placeholder {
    color: var(--text-dim);
    font-weight: 400;
  }

  .field textarea {
    resize: none;
    min-height: 64px;
    line-height: 1.5;
    font-weight: 400;
  }

  /* Estilo do botão de microfone */
  .btn-mic {
    background: transparent;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    padding: 4px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s, background 0.2s, transform 0.1s;
    flex-shrink: 0;
  }

  .btn-mic:hover {
    color: var(--accent);
    background: rgba(0,0,0,0.05);
  }

  .btn-mic:active {
    transform: scale(0.92);
  }

  /* Animação quando o microfone está ouvindo */
  .btn-mic.listening {
    color: var(--active-mic);
    animation: pulse 1.2s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.2); opacity: 0.7; }
    100% { transform: scale(1); opacity: 1; }
  }

  .btn-extract {
    width: 100%;
    margin-top: 24px;
    padding: 14px 20px;
    background: #1a1a18;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: background 0.15s, transform 0.08s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-extract:hover { background: #2c2c2a; }
  .btn-extract:active { transform: scale(0.99); }

  .result-area {
    display: none;
    margin-top: 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .result-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .result-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .btn-copy {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    background: transparent;
    border: 1px solid rgba(212,240,74,0.25);
    border-radius: 5px;
    padding: 3px 10px;
    cursor: pointer;
    transition: background 0.12s;
    letter-spacing: 0.05em;
  }

  .btn-copy:hover { background: rgba(212,240,74,0.08); }

  .result-text {
    padding: 14px 16px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    line-height: 1.6;
    word-break: break-all;
    background: var(--surface2);
  }

  .pipe { color: var(--accent); opacity: 0.6; }
  .semicolon { color: var(--accent); font-weight: bold; margin: 0 4px; }

  @media (max-width: 480px) {
    .form-grid { grid-template-columns: 1fr; }
    .field.full { grid-column: 1; }
    h1 { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Detalhamento de Ocorrências</h1>
  </header>

  <!-- Área de Abas -->
  <div class="tabs" id="tabs-container"></div>

  <!-- Campos do Item (Dinâmico) -->
  <div class="form-grid" id="item-fields">
    <div class="field full">
      <label for="f-nome">Nome comercial do produto</label>
      <div class="input-mic-wrapper">
        <input id="f-nome" type="text" placeholder="Nome do produto">
        <button type="button" class="btn-mic" onclick="ouvirCampo('f-nome')" title="Preencher por voz">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </button>
      </div>
    </div>

    <div class="field full">
      <label for="f-marca">Marca ou fabricante</label>
      <div class="input-mic-wrapper">
        <input id="f-marca" type="text" placeholder="Ex: Empresa LTDA">
        <button type="button" class="btn-mic" onclick="ouvirCampo('f-marca')" title="Preencher por voz">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </button>
      </div>
    </div>

    <div class="field">
      <label for="f-ativo">Princípio ativo ou substância</label>
      <div class="input-mic-wrapper">
        <input id="f-ativo" type="text" placeholder="Ex: Diclofenaco sódico">
        <button type="button" class="btn-mic" onclick="ouvirCampo('f-ativo')" title="Preencher por voz">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </button>
      </div>
    </div>

    <div class="field">
      <label for="f-concentracao">Concentração / especificação</label>
      <div class="input-mic-wrapper">
        <input id="f-concentracao" type="text" placeholder="Ex: 300mg ou aço inox estéril">
        <button type="button" class="btn-mic" onclick="ouvirCampo('f-concentracao')" title="Preencher por voz">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </button>
      </div>
    </div>

    <div class="field">
      <label for="f-quantidade">Quantidade e Unidade</label>
      <div class="input-mic-wrapper">
        <input id="f-quantidade" type="text" placeholder="Ex: 5 caixas ou 10 unidades">
        <button type="button" class="btn-mic" onclick="ouvirCampo('f-quantidade')" title="Preencher por voz">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </button>
      </div>
    </div>

    <div class="field">
      <label for="f-forma">Forma de apresentação</label>
      <div class="input-mic-wrapper">
        <input id="f-forma" type="text" placeholder="Ex: solução ou creme">
        <button type="button" class="btn-mic" onclick="ouvirCampo('f-forma')" title="Preencher por voz">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </button>
      </div>
    </div>

    <div class="field">
      <label for="f-lote">Nº lote / serial / partnumber</label>
      <div class="input-mic-wrapper">
        <input id="f-lote" type="text" placeholder="Ex: 1254tg">
        <button type="button" class="btn-mic" onclick="ouvirCampo('f-lote')" title="Preencher por voz">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </button>
      </div>
    </div>

    <div class="field">
      <label for="f-peso">Peso total bruto</label>
      <div class="input-mic-wrapper">
        <input id="f-peso" type="text" placeholder="Ex: 500 g">
        <button type="button" class="btn-mic" onclick="ouvirCampo('f-peso')" title="Preencher por voz">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </button>
      </div>
    </div>

    <div class="field full">
      <label for="f-data">Prazo de validade</label>
      <div class="input-mic-wrapper">
        <input id="f-data" type="text" placeholder="Ex: 30/06/2026">
        <button type="button" class="btn-mic" onclick="ouvirCampo('f-data')" title="Preencher por voz">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Campo Global -->
  <span class="section-label">Informações Adicionais (Globais)</span>
  <div class="form-grid">
    <div class="field full">
      <label for="f-obs">Informações adicionais sobre a ocorrência: Indicar se foi apresentada prescrição, relatório médico ou outro documento relevante; conservação da embalagem, indícios de fraude, etc.</label>
      <div class="input-mic-wrapper" style="align-items: flex-start;">
        <textarea id="f-obs" placeholder="Informações adicionais..."></textarea>
        <button type="button" class="btn-mic" onclick="ouvirCampo('f-obs')" title="Preencher por voz" style="margin-top: 4px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </button>
      </div>
    </div>
  </div>

  <button class="btn-extract" onclick="extrair()">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Gerar texto
  </button>

  <div id="result-area" class="result-area">
    <div class="result-header">
      <span class="result-label">Resultado</span>
      <button class="btn-copy" id="btn-copy" onclick="copiar()">Copiar</button>
    </div>
    <div id="result-text" class="result-text"></div>
  </div>
</div>

<script>
  // Estado da aplicação
  var items = [];
  var currentIndex = 0;
  
  // Campos pertencentes a cada item
  var fields = [
    'nome', 'marca', 'ativo', 'concentracao', 
    'quantidade', 'forma', 'lote', 'peso', 'data'
  ];

  // Inicialização
  window.onload = function() {
    items.push(createEmptyItem());
    renderTabs();
    loadCurrentItem();
  };

  function createEmptyItem() {
    var obj = {};
    fields.forEach(function(f) { obj[f] = ''; });
    return obj;
  }

  function renderTabs() {
    var container = document.getElementById('tabs-container');
    container.innerHTML = '';

    // Botões dos Itens
    items.forEach(function(item, index) {
      var btn = document.createElement('button');
      btn.className = 'tab-btn' + (index === currentIndex ? ' active' : '');
      btn.innerText = 'Item ' + (index + 1);
      btn.onclick = function() { switchItem(index); };
      container.appendChild(btn);
    });

    // Botão + Novo Item
    var addBtn = document.createElement('button');
    addBtn.className = 'tab-btn add-btn';
    addBtn.innerText = '+ Novo Item';
    addBtn.onclick = addNewItem;
    container.appendChild(addBtn);
  }

  function saveCurrentItem() {
    fields.forEach(function(f) {
      items[currentIndex][f] = document.getElementById('f-' + f).value;
    });
  }

  function loadCurrentItem() {
    fields.forEach(function(f) {
      document.getElementById('f-' + f).value = items[currentIndex][f];
    });
  }

  function switchItem(index) {
    saveCurrentItem();
    currentIndex = index;
    loadCurrentItem();
    renderTabs();
  }

  function addNewItem() {
    saveCurrentItem();
    items.push(createEmptyItem());
    currentIndex = items.length - 1; // Seleciona o novo item criado
    loadCurrentItem();
    renderTabs();
  }

  function extrair() {
    // Salva qualquer alteração pendente no item atual
    saveCurrentItem();

    // Arrays para montar texto e HTML
    var itemStrings = items.map(function(item) {
      return fields.map(function(f) { 
        return item[f].trim().toUpperCase(); 
      });
    });

    // Montagem Texto Puro
    var textoItems = itemStrings.map(function(vals) {
      return vals.join('|');
    }).join(';');

    // Montagem HTML (com pipes coloridos)
    var htmlItems = itemStrings.map(function(vals) {
      return vals.map(function(v) {
        return '<span>' + escHtml(v) + '</span>';
      }).join('<span class="pipe">|</span>');
    }).join('<span class="semicolon">;</span><br>');

    // Informações Adicionais (Globais)
    var obs = document.getElementById('f-obs').value.trim().toUpperCase();

    var textoFinal = textoItems;
    var htmlFinal = htmlItems;

    if (obs) {
      textoFinal += '\n\n' + obs;
      htmlFinal += '<br><br><span>' + escHtml(obs).replace(/\n/g, '<br>') + '</span>';
    }

    // Exibição
    document.getElementById('result-text').innerHTML = htmlFinal;
    document.getElementById('result-text').style.textTransform = 'uppercase';
    document.getElementById('result-area').style.display = 'block';
    document.getElementById('btn-copy').textContent = 'Copiar';
    document.getElementById('result-area').scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    // Guarda texto puro para copiar
    document.getElementById('result-area').dataset.raw = textoFinal;
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function copiar() {
    var texto = document.getElementById('result-area').dataset.raw || '';
    navigator.clipboard.writeText(texto).then(function() {
      var btn = document.getElementById('btn-copy');
      btn.textContent = 'Copiado!';
      setTimeout(function() { btn.textContent = 'Copiar'; }, 1500);
    });
  }

  // ==========================================
  // RECONHECIMENTO DE VOZ (Web Speech API)
  // ==========================================
  var currentRecognition = null;

  function ouvirCampo(fieldId) {
    var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      alert("Seu navegador não suporta reconhecimento de voz. Recomendamos usar o Google Chrome ou Microsoft Edge.");
      return;
    }

    // Se já houver uma escuta ativa, interrompe
    if (currentRecognition) {
      currentRecognition.stop();
    }

    var recognition = new SpeechRecognition();
    currentRecognition = recognition;

    recognition.lang = 'pt-BR';
    recognition.continuous = false;
    recognition.interimResults = false;

    var inputEl = document.getElementById(fieldId);
    var micBtn = inputEl.nextElementSibling;
    var originalPlaceholder = inputEl.placeholder;

    recognition.onstart = function() {
      inputEl.placeholder = "Escutando...";
      if (micBtn) micBtn.classList.add('listening');
    };

    recognition.onresult = function(event) {
      var textoTranscrito = event.results[0][0].transcript;
      
      // Trata vírgulas/pontos e ajusta o texto
      var textoFormatado = textoTranscrito.trim();
      
      // Se for o campo de obs, concatena se já tiver algo; se for outro campo, substitui/preenche
      if (fieldId === 'f-obs' && inputEl.value.trim() !== '') {
        inputEl.value += ' ' + textoFormatado;
      } else {
        inputEl.value = textoFormatado;
      }

      // Atualiza o estado no array JavaScript
      saveCurrentItem();
    };

    recognition.onerror = function(event) {
      console.error("Erro no reconhecimento de voz: ", event.error);
      if (event.error === 'not-allowed') {
        alert("Permissão de microfone negada. Por favor, permita o acesso ao microfone nas configurações do seu navegador.");
      }
    };

    recognition.onend = function() {
      inputEl.placeholder = originalPlaceholder;
      if (micBtn) micBtn.classList.remove('listening');
      currentRecognition = null;
    };

    recognition.start();
  }
</script>
</body>
</html>
